<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Website Name </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />

</head>
<body>
    <div id="nav"></div>
 
    <main class="container py-4">
        <h2>Admin: inventory</h2>
        <div id="alerts"></div>
 
        <form id="addProduct" class="card card-body mb-4">
            <h4>Add a new product</h4>
            <div class="row g-2">
                <div class="col-md-4"><label class="form-label" for="pname">Name</label><input class="form-control" id="pname" required></div>
                <div class="col-md-3"><label class="form-label" for="pcategory">Category</label><input class="form-control" id="pcategory" list="cats" required><datalist id="cats"></datalist></div>
                <div class="col-md-2"><label class="form-label" for="pprice">Price ($)</label><input type="number" step="0.01" min="0.01" class="form-control" id="pprice" required></div>
                <div class="col-md-2"><label class="form-label" for="pcost">Cost ($)</label><input type="number" step="0.01" min="0" class="form-control" id="pcost" required></div>
                <div class="col-md-1"><label class="form-label" for="pstock">Stock</label><input type="number" min="0" class="form-control" id="pstock" value="0" required></div>
                <div class="col-12"><label class="form-label" for="pdesc">Description</label><input class="form-control" id="pdesc"></div>
            </div>
            <button class="btn btn-primary mt-3 align-self-start" type="submit">Add product</button>
        </form>
 
        <h4>Current inventory</h4>
        <div class="table-responsive">
            <table class="table table-sm table-striped">
                <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Cost</th><th>Stock</th><th style="width:220px">Receive shipment</th></tr></thead>
                <tbody id="inventory"></tbody>
            </table>
        </div>
    </main>
 
    <div id="footer"></div>
