<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers | Website Name </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <div id="nav"></div>
 
    <main class="container py-4">
        <h2>Customers</h2>
        <div id="alerts"></div>
 
        <div class="row g-4">
            <!-- Register -->
            <div class="col-lg-6">
                <form id="register" class="card card-body">
                    <h4>Register a new customer</h4>
                    <div class="row g-2">
                        <div class="col-12">
                            <label class="form-label" for="name">Name</label>
                            <input class="form-control" id="name" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="street">Street</label>
                            <input class="form-control" id="street" required>
                        </div>
                        <div class="col-md-5"><label class="form-label" for="city">City</label><input class="form-control" id="city" required></div>
                        <div class="col-md-3"><label class="form-label" for="state">State</label><input class="form-control" id="state" maxlength="2" required></div>
                        <div class="col-md-4"><label class="form-label" for="zip">Zip</label><input class="form-control" id="zip" pattern="\d{5}" required></div>
                        <div class="col-12">
                            <label class="form-label" for="kind">Customer kind</label>
                            <select class="form-select" id="kind">
                                <option value="home">Home</option>
                                <option value="business">Business</option>
                            </select>
                        </div>
                    </div>
 
                    <!-- Business-only fields -->
                    <div id="business-fields" class="row g-2 mt-1 d-none">
                        <div class="col-md-6"><label class="form-label" for="businessCategory">Business category</label><input class="form-control" id="businessCategory"></div>
                        <div class="col-md-6"><label class="form-label" for="grossIncome">Gross annual income ($)</label><input type="number" class="form-control" id="grossIncome" min="0"></div>
                    </div>
 
                    <button class="btn btn-primary mt-3 align-self-start" type="submit">Register</button>
                </form>
            </div>
 
            <!-- Lookup / history -->
            <div class="col-lg-6">
                <form id="lookup" class="card card-body mb-3">
                    <h4>Look up customer &amp; purchase history</h4>
                    <div class="input-group">
                        <input type="number" class="form-control" id="lookupId" placeholder="Customer ID" min="1" required>
                        <button class="btn btn-outline-primary" type="submit">Find</button>
                    </div>
                </form>
                <div id="profile"></div>
            </div>
        </div>
    </main>
 
    <div id="footer"></div>
