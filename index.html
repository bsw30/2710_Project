<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Meet the tiny plastic dinosaurs made for big adventures.">
  <meta name="theme-color" content="#f8f7f2">
  <title>Tiny Time — Little dinos, big adventures</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/layout.js" defer></script>
</head>
<body class="d-flex min-vh-100 flex-column">
  <div id="nav"></div>
  <main class="flex-grow-1">
    <section class="container py-5">
      <div class="row align-items-center g-4">
        <div class="col-12 col-md-6">
          <p class="text-body-secondary small mb-2">A pocket-sized prehistoric world</p>
          <h1 class="h1 fw-semibold">Little dinos. Big adventures.</h1>
          <p class="text-body-secondary mb-0">Meet the tiny plastic friends ready to stomp, snack, and make themselves at home on your shelf.</p>
        </div>
        <div class="col-12 col-md-6">
          <img class="img-fluid w-100" src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/dino_pool-zCANKb8b6Mt2mK9ND2LRRY0BYZAPqW.jpg" alt="Colorful toy dinosaurs beside a bright blue pool." fetchpriority="high" decoding="async">
        </div>
      </div>
    </section>

    <section class="container pb-5" id="collection">
      <div class="d-flex flex-wrap align-items-end justify-content-between gap-2 mb-3">
        <div>
          <p class="text-body-secondary small mb-1">Choose your dino</p>
          <h2 class="h3 mb-0">The mini herd</h2>
        </div>
        <p class="text-body-secondary small mb-0">Example catalog for the storefront layout.</p>
      </div>

      <form id="filters" class="row g-2 align-items-end mb-3" role="search">
        <div class="col-12 col-md-4">
          <label class="form-label" for="q">Search</label>
          <input type="search" id="q" class="form-control" placeholder="Search dinosaurs" autocomplete="off">
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label" for="category">Type</label>
          <select id="category" class="form-select">
            <option value="">All dinos</option>
            <option value="Predator">Predators</option>
            <option value="Herbivore">Plant eaters</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label" for="maxPrice">Max price</label>
          <input type="number" id="maxPrice" class="form-control" min="0" step="0.01" placeholder="Any price">
        </div>
        <div class="col-8 col-md-2">
          <label class="form-label" for="sort">Sort by</label>
          <select id="sort" class="form-select">
            <option value="name">Name A–Z</option>
            <option value="price_asc">Price: low to high</option>
            <option value="price_desc">Price: high to low</option>
          </select>
        </div>
        <div class="col-4 col-md-2 d-grid">
          <button class="btn btn-outline-success" type="submit">Filter</button>
        </div>
      </form>

      <p class="small text-body-secondary" id="results-count" aria-live="polite">Our favorite little legends</p>
      <div id="results" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3"></div>

      <section class="pt-5" aria-labelledby="dino-gallery-title">
        <h2 class="h3 mb-3" id="dino-gallery-title">Tiny dinosaur moments</h2>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3">
          <div class="col">
            <div class="ratio ratio-4x3">
              <img class="w-100 h-100 object-fit-cover" src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/background_02-W78EGjQR19H1SqIpZItLNILnvHSjxM.jpg" alt="A group of colorful toy dinosaurs, with a green stegosaurus in focus." loading="lazy" decoding="async">
            </div>
          </div>
          <div class="col">
            <div class="ratio ratio-4x3">
              <img class="w-100 h-100 object-fit-cover" src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/dino_party-hjLooiEtOT4K40MdzQuMqyhcvBt7H2.jpg" alt="Toy dinosaurs gathered for a colorful party." loading="lazy" decoding="async">
            </div>
          </div>
          <div class="col">
            <div class="ratio ratio-4x3">
              <img class="w-100 h-100 object-fit-cover" src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/rex_keyboard-wJZNEcq7VIHoHVi7YcxgBefYcbFOky.jpg" alt="A green T. rex toy beside a yellow keyboard." loading="lazy" decoding="async">
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>
  <div id="footer"></div>
</body>
</html>
