<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Website Name </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <div id="nav"></div>
 
    <main class="container py-4">
        <h2>Sales reports</h2>
        <div id="alerts"></div>
 
        <div class="row g-4">
            <div class="col-12">
                <div class="card card-body">
                    <h5>Sales and profit by product</h5>
                    <div class="table-responsive"><table class="table table-sm">
                        <thead><tr><th>Product</th><th>Category</th><th class="text-end">Units</th><th class="text-end">Revenue</th><th class="text-end">Profit</th></tr></thead>
                        <tbody id="productSales"></tbody></table></div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card card-body">
                    <h5>Top product categories</h5>
                    <table class="table table-sm"><thead><tr><th>Category</th><th class="text-end">Revenue</th></tr></thead>
                        <tbody id="topCategories"></tbody></table>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card card-body">
                    <h5>Regions by sales volume</h5>
                    <table class="table table-sm"><thead><tr><th>Region</th><th class="text-end">Orders</th><th class="text-end">Revenue</th></tr></thead>
                        <tbody id="regionSales"></tbody></table>
                </div>
            </div>
        </div>
    </main>
 
    <div id="footer"></div>
